name: Build & Package Notepad++ macOS

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and Package macOS Installers (.dmg & .zip)
        env:
          # Disable Apple Developer certificate requirement during CI builds
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --publish never

      - name: Upload Build Artifacts (.dmg & .zip)
        uses: actions/upload-artifact@v4
        with:
          name: Notepad++-macOS-Installers
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release (on tag or manual release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          name: Notepad++ macOS Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
